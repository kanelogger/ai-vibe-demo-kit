schema_version: 1

project:
  id: "<project-id>"
  name: "<project-name>"
  summary: "<one-sentence project description>"
  in_scope:
    - "<primary deliverable>"
  out_of_scope:
    - "<explicit non-goal>"

repositories:
  primary: "."
  related: []

environment:
  supported_os:
    - "<macos-or-linux>"
  supported_architectures:
    - "<arm64-or-x86_64>"
  toolchains:
    node:
      manager: "volta"
      version_source: "package.json"
    package_manager:
      name: "pnpm"
      version_source: "package.json#packageManager"
    python:
      manager: "<pyenv-or-miniconda-or-none>"
      version_source: "<.python-version-or-environment.yml>"
    java:
      manager: "<jenv-or-none>"
      version_source: "<.java-version-or-pom.xml>"
    containers:
      runtime: "<orbstack-or-docker-or-none>"
  probes:
    - tool: "operating-system"
      command: "uname -s"
      expected_source: "project.yml#environment.supported_os"
      required: true
    - tool: "architecture"
      command: "uname -m"
      expected_source: "project.yml#environment.supported_architectures"
      required: true
    - tool: "node"
      command: "node --version"
      expected_source: "<package.json-or-runtime-manifest>"
      required: true
    - tool: "git"
      command: "git --version"
      expected_source: "<project-policy>"
      required: true
    - tool: "package-manager"
      command: "<package-manager> --version"
      expected_source: "<package-manager-version-source>"
      required: false
    - tool: "container-runtime"
      command: "<container-runtime> --version"
      expected_source: "project.yml#environment.toolchains.containers"
      required: false

commands:
  install: "<command>"
  develop: "<command>"
  test: "<command>"
  typecheck: "<command>"
  lint: "<command>"
  build: "<command>"
  harness_check: "./harness check --workflow source/workflows/workflow-template.json"
  environment_check: "./harness check-environment --file AI_ENVIRONMENT.md --json"
  completion_check: "./harness check-result --workflow <workflow.json> --stage <stage> --file <stage-result.json> --require-complete --json"

authoritative_context:
  agent_entry: "AGENTS.md"
  ai_environment: "AI_ENVIRONMENT.md"
  architecture: "ARCHITECTURE.md"
  source_manifest: "source/manifest.json"
  knowledge_index: "source/knowledge/INDEX.md"
  knowledge_routing: "source/knowledge/ROUTING.md"
  rules: "source/rules/"
  specs: "source/specs/"

architecture_memory:
  filename: "ARCHITECTURE.md"
  code_roots:
    - "<code-root>"
  exclude:
    - "**/__tests__"
    - "**/fixtures"
    - "**/generated"
    - "**/vendor"

capabilities:
  skill_sources: ".agents/skills.sources.json"
  skill_lock: ".agents/skills.lock.json"
  project_skills: "skills/"
  installed_skills: ".agents/skills/"

workflow:
  definitions: "source/workflows/"
  profiles: "source/workflows/profiles.json"
  default: "source/workflows/workflow-template.json"
  active_state: ".git/harness/control.json"
  stage_result_template: "source/workflows/stage-result-template.json"
  verification_report_template: "source/workflows/verification-report-template.json"
  evidence_root: "work/requirements/"

permissions:
  default: "read-only"
  write_roots:
    - "."
  require_human_approval:
    - "publish"
    - "production-write"
    - "destructive-operation"
