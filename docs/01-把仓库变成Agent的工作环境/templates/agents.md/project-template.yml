schema_version: 2

# 仅填写已从仓库、CI 配置或安全探测中确认的事实。未知项使用 unknown，
# 不适用项使用 not-applicable；不要把本模板中的值当作项目事实。
project:
  id: unknown
  name: unknown
  summary: unknown
  in_scope: []
  out_of_scope: []

repositories:
  primary: "."
  related: []

environment:
  supported_os: []
  supported_architectures: []
  toolchains: {}
  probes: []
  # 每项探测应记录 evidence、verified_at、refresh_when 和 status。

commands:
  # 没有证据时保持 not-applicable；运行前必须验证命令存在、cwd、依赖和权限。
  install: not-applicable
  develop: not-applicable
  test: not-applicable
  typecheck: not-applicable
  lint: not-applicable
  build: not-applicable
  # e2e 填实际可运行的全套命令；针对性场景的执行方式写入测试规则或环境命令文档。
  # 若无全套入口，保持 not-applicable，不得把普通 node --test 命令当作 E2E。
  e2e: not-applicable
  browser_test: not-applicable
  # 维护流程、harness、commit 检查和 completion 检查不是默认命令。
  validation_policy: "开发期间选针对性检查；有适用 E2E 的实现任务交付前在最终代码上运行全套；未运行、跳过或失败的检查必须报告。"

authoritative_context:
  agent_entry: AGENTS.md
  ai_environment: AI_ENVIRONMENT.md
  architecture: not-applicable
  source_manifest: not-applicable
  knowledge_index: not-applicable
  knowledge_routing: not-applicable
  rules: not-applicable
  specs: not-applicable

architecture_memory:
  filename: not-applicable
  code_roots: []
  exclude: []

capabilities:
  skill_sources: .agents/skills.sources.json

workflow:
  definitions: not-applicable
  default: not-applicable
  active_state: not-applicable
  stage_result_template: not-applicable
  execution_trace_template: not-applicable
  verification_report_template: not-applicable
  evidence_root: work/requirements/

permissions:
  default: read-only
  write_roots:
    - "."
  require_human_approval:
    - publish
    - production-write
    - destructive-operation
  local_reversible_edits: allowed-when-authorized
  external_system_writes: approval-required

freshness:
  source: AI_ENVIRONMENT.md and referenced environment chapters
  stale_facts_must_not_be_used: true
  refresh_triggers:
    - toolchain-change
    - dependency-change
    - ci-image-change
    - permission-change
    - network-policy-change
    - service-configuration-change

completion:
  definition: "满足任务验收标准，运行必要的相关验证，处理由本次改动导致的失败，并报告未执行或失败的检查。"
