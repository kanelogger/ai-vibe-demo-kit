schema_version: 1

project:
  id: "project-agent-harness"
  name: "Project Agent Harness"
  summary: "Zero-dependency repository control layer for Agent workflows, evidence and human gates."
  in_scope:
    - "Workflow and Stage Result validation"
    - "Deterministic state transitions and human control"
    - "Safe installation into Git repositories"
  out_of_scope:
    - "Executing tests, Skills or business code"
    - "Platform Hooks and remote orchestration"
    - "Publishing or production writes"

repositories:
  primary: "."
  related: []

environment:
  supported_os:
    - "macos"
    - "linux"
  supported_architectures:
    - "arm64"
    - "x86_64"
  toolchains:
    node:
      manager: "none"
      minimum_version: "22"
      tested_versions:
        - "22"
        - "24"
      version_source: ".harness/manifest.json#minimumNodeVersion"
    git:
      required: true
      version_source: "system"
    package_manager:
      name: "none"
      reason: "The Runtime has no npm dependencies."
    containers:
      runtime: "none-required"
  probes:
    - tool: "operating-system"
      command: "uname -s"
      expected_source: "project.yml#environment.supported_os"
      required: true
    - tool: "architecture"
      command: "uname -m"
      expected_source: "project.yml#environment.supported_architectures"
      required: true
    - tool: "node"
      command: "node --version"
      expected_source: ".harness/manifest.json#minimumNodeVersion"
      required: true
    - tool: "git"
      command: "git --version"
      expected_source: "project.yml#environment.toolchains.git"
      required: true
    - tool: "package-manager"
      command: "npm --version"
      expected_source: "project.yml#environment.toolchains.package_manager"
      required: false
    - tool: "container-runtime"
      command: "docker --version"
      expected_source: "project.yml#environment.toolchains.containers"
      required: false

commands:
  install_runtime: "node bin/harness.mjs init --target <git-root>"
  develop: "./harness help"
  test: "node --test scripts/harness/test/*.test.mjs"
  typecheck: null
  lint: null
  build: null
  harness_check: "./harness check --json"
  version: "./harness version --json"
  commit_check: "node scripts/check-commit-messages.mjs <base-ref> HEAD"
  completion_check: "node scripts/check-completion-evidence.mjs <base-ref> HEAD"

authoritative_context:
  agent_entry: "AGENTS.md"
  architecture: "ARCHITECTURE.md"
  knowledge_index: "knowledge/INDEX.md"
  knowledge_routing: "knowledge/ROUTING.md"
  rules: "rules/"
  specs: "SPECS/"

architecture_memory:
  filename: "ARCHITECTURE.md"
  code_roots:
    - "bin"
    - "scripts"
  exclude:
    - "scripts/harness/test"
    - "**/fixtures"
    - "**/generated"

capabilities:
  installed_skills: ".agents/skills/"

workflow:
  definitions: "workflows/"
  default: "workflows/workflow-template.json"
  active_state: ".git/harness/control.json"
  stage_result_template: "workflows/stage-result-template.json"
  verification_report_template: "workflows/verification-report-template.json"
  evidence_root: "work/requirements/"

permissions:
  default: "read-only"
  write_roots:
    - "."
  require_human_approval:
    - "publish"
    - "production-write"
    - "destructive-operation"
