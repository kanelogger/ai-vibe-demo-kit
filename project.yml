schema_version: 1

project:
  id: "ai-vibe-demo-kit"
  name: "AI Vibe Demo Kit"
  summary: "Zero-dependency CLI for distributing a recoverable Coding Agent Source and controlling its workflows."
  in_scope:
    - "Workflow and Stage Result validation"
    - "Deterministic state transitions and human control"
    - "Safe installation lifecycle in Git repositories"
    - "Versioned distribution of knowledge, rules, specs, workflows and project templates under source/"
  out_of_scope:
    - "Executing tests, Skills or business code"
    - "Resolving, locking, installing, materializing or checking readiness of external Skills"
    - "Platform Hooks and remote orchestration"
    - "Automatic publishing or production writes"

repositories:
  primary: "."
  related: []

environment:
  supported_os:
    - "macos"
    - "linux"
  supported_architectures:
    - "arm64"
    - "x86_64"
  toolchains:
    node:
      manager: "none"
      minimum_version: "22"
      tested_versions:
        - "22"
        - "24"
      version_source: ".harness/manifest.json#minimumNodeVersion"
    git:
      required: true
      version_source: "system"
    package_manager:
      name: "npm"
      version: "11.16.0"
      version_source: "package.json#packageManager"
      runtime_requirement: "none; installed Runtime has zero npm dependencies"
    containers:
      runtime: "none-required"
  probes:
    - tool: "operating-system"
      command: "uname -s"
      expected_source: "project.yml#environment.supported_os"
      required: true
    - tool: "architecture"
      command: "uname -m"
      expected_source: "project.yml#environment.supported_architectures"
      required: true
    - tool: "node"
      command: "node --version"
      expected_source: ".harness/manifest.json#minimumNodeVersion"
      required: true
    - tool: "git"
      command: "git --version"
      expected_source: "project.yml#environment.toolchains.git"
      required: true
    - tool: "package-manager"
      command: "npm --version"
      expected_source: "project.yml#environment.toolchains.package_manager"
      required: true
    - tool: "container-runtime"
      command: "docker --version"
      expected_source: "project.yml#environment.toolchains.containers"
      required: false

commands:
  install_runtime: "npx --yes ai-vibe-demo-kit@0.5.1 init --target <git-root> --json"
  develop: "./harness help"
  test: "node --test test/runtime/*.test.mjs test/distribution/*.test.mjs"
  typecheck: null
  lint: null
  build: null
  harness_check: "./harness check --workflow source/workflows/workflow-default.json --json"
  architecture_check: "./harness check-architecture --file project.yml --json"
  version: "./harness version --json"
  commit_check: "node source/tools/check-commit-messages.mjs <base-ref> HEAD"
  change_test_check: "node source/tools/check-change-tests.mjs <base-ref> HEAD --behavior-path bin --behavior-path src --behavior-path scripts --behavior-path source/tools --behavior-path source/workflows --behavior-path publish-npm.sh --test-root test"
  completion_check: "node source/tools/check-completion-evidence.mjs <base-ref> HEAD"
  skill_validation: "node scripts/validate-bundled-skill.mjs"
  distribution_check: "node scripts/check-distribution.mjs"
  pack: "npm pack --dry-run --json"
  publish: "npm publish --access public"

release:
  profile: "source-only"
  node_version: "24.18.0"
  npm_version: "11.16.0"
  manual_approval_required: true
  registry_network_required: true
  canonical_sequence:
    - "npm view ai-vibe-demo-kit@0.5.1 must return not found before checks"
    - "node scripts/validate-bundled-skill.mjs"
    - "./harness check-architecture --file project.yml --json"
    - "./harness check --workflow source/workflows/workflow-default.json --json"
    - "node scripts/check-distribution.mjs"
    - "node --test test/runtime/*.test.mjs test/distribution/*.test.mjs"
    - "npm pack --dry-run --json"
    - "npm publish --access public"
    - "npm view ai-vibe-demo-kit@0.5.1"

authoritative_context:
  agent_entry: "AGENTS.md"
  architecture: "ARCHITECTURE.md"
  source_manifest: "source/manifest.json"
  knowledge_index: "source/knowledge/INDEX.md"
  knowledge_routing: "source/knowledge/ROUTING.md"
  rules: "source/rules/"
  specs: "source/specs/"

architecture_memory:
  filename: "ARCHITECTURE.md"
  code_roots:
    - "bin"
    - "src"
    - "scripts"
  exclude:
    - "test"
    - "payload"
    - "**/fixtures"
    - "**/generated"

capabilities:
  skill_sources: "source/.agents/skills.sources.json"

workflow:
  definitions: "source/workflows/"
  default: "source/workflows/workflow-default.json"
  active_state: ".git/harness/control.json"
  stage_result_template: "source/workflows/stage-result-template.json"
  verification_report_template: "source/workflows/verification-report-template.json"
  evidence_root: "work/requirements/"

permissions:
  default: "read-only"
  write_roots:
    - "."
  require_human_approval:
    - "publish"
    - "production-write"
    - "destructive-operation"
